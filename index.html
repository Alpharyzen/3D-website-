<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Dark Portfolio — Michael Smith</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&family=Instrument+Serif:ital@0;1&display=swap" rel="stylesheet" />

  <!-- Tailwind CSS via Play CDN -->
  <script src="https://cdn.tailwindcss.com"></script>

  <style>
    /* Custom CSS variables and keyframes */
    :root {
      --bg: 0 0% 4%;
      --surface: 0 0% 8%;
      --text: 0 0% 96%;
      --muted: 0 0% 53%;
      --stroke: 0 0% 12%;
    }

    body {
      background-color: hsl(var(--bg));
      color: hsl(var(--text));
      font-family: 'Inter', sans-serif;
      -webkit-font-smoothing: antialiased;
    }

    .accent-gradient {
      background: linear-gradient(90deg, #89AACC 0%, #4E85BF 100%);
    }

    @keyframes scroll-down {
      0% { transform: translateY(-100%); }
      100% { transform: translateY(200%); }
    }
    @keyframes role-fade-in {
      0% { opacity: 0; transform: translateY(8px); }
      100% { opacity: 1; transform: translateY(0); }
    }
    @keyframes gradient-shift {
      0% { background-position: 0% 50%; }
      50% { background-position: 100% 50%; }
      100% { background-position: 0% 50%; }
    }

    .animate-scroll-down {
      animation: scroll-down 1.5s ease-in-out infinite;
    }
    .animate-role-fade-in {
      animation: role-fade-in 0.4s ease-out;
    }
    .animate-gradient-shift {
      animation: gradient-shift 6s ease infinite;
    }

    /* Custom utility classes (tailwind doesn't generate these from arbitrary values) */
    .bg-bg { background-color: hsl(var(--bg)); }
    .bg-surface { background-color: hsl(var(--surface)); }
    .text-text-primary { color: hsl(var(--text)); }
    .text-muted { color: hsl(var(--muted)); }
    .border-stroke { border-color: hsl(var(--stroke)); }
    .from-bg { --tw-gradient-from: hsl(var(--bg)); }
  </style>

  <!-- Import Map for ESM dependencies -->
  <script type="importmap">
    {
      "imports": {
        "react": "https://esm.sh/react@18.2.0",
        "react-dom/client": "https://esm.sh/react-dom@18.2.0/client",
        "framer-motion": "https://esm.sh/framer-motion@11.0.2",
        "gsap": "https://esm.sh/gsap@3.12.4",
        "gsap/ScrollTrigger": "https://esm.sh/gsap@3.12.4/ScrollTrigger",
        "hls.js": "https://esm.sh/hls.js@0.14.17"
      }
    }
  </script>

  <!-- Babel Standalone for JSX in the browser -->
  <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
</head>
<body>
  <div id="root"></div>

  <!-- Main App Script (Babel transforms JSX) -->
  <script type="text/babel">
    import React, { useState, useEffect, useRef } from 'react';
    import { createRoot } from 'react-dom/client';
    import { motion, AnimatePresence } from 'framer-motion';
    import gsap from 'gsap';
    import ScrollTrigger from 'gsap/ScrollTrigger';
    import Hls from 'hls.js';

    // Register GSAP plugin
    gsap.registerPlugin(ScrollTrigger);

    // ---------- Loading Screen ----------
    function LoadingScreen({ onComplete }) {
      const [count, setCount] = useState(0);
      const [roleIndex, setRoleIndex] = useState(0);
      const roles = ['Design', 'Create', 'Inspire'];
      const startTimeRef = useRef(performance.now());
      const frameRef = useRef();

      useEffect(() => {
        const animate = (time) => {
          const elapsed = time - startTimeRef.current;
          const progress = Math.min(elapsed / 2700, 1);
          const newCount = Math.floor(progress * 100);
          setCount(newCount);
          if (newCount < 100) {
            frameRef.current = requestAnimationFrame(animate);
          } else {
            setTimeout(onComplete, 400);
          }
        };
        frameRef.current = requestAnimationFrame(animate);
        return () => cancelAnimationFrame(frameRef.current);
      }, [onComplete]);

      useEffect(() => {
        const interval = setInterval(() => {
          setRoleIndex((prev) => (prev + 1) % roles.length);
        }, 900);
        return () => clearInterval(interval);
      }, []);

      return (
        <div className="fixed inset-0 z-[9999] bg-bg flex flex-col justify-between p-8 md:p-12">
          <motion.div
            initial={{ y: -20, opacity: 0 }}
            animate={{ y: 0, opacity: 1 }}
            transition={{ duration: 0.6 }}
            className="text-xs text-muted uppercase tracking-[0.3em]"
          >
            Portfolio
          </motion.div>
          <div className="flex-1 flex items-center justify-center">
            <AnimatePresence mode="wait">
              <motion.div
                key={roleIndex}
                initial={{ y: 20, opacity: 0 }}
                animate={{ y: 0, opacity: 1 }}
                exit={{ y: -20, opacity: 0 }}
                transition={{ duration: 0.4 }}
                className="text-4xl md:text-6xl lg:text-7xl font-display italic text-text-primary/80"
                style={{ fontFamily: "'Instrument Serif', serif" }}
              >
                {roles[roleIndex]}
              </motion.div>
            </AnimatePresence>
          </div>
          <div className="flex justify-end">
            <div className="text-6xl md:text-8xl lg:text-9xl font-display text-text-primary tabular-nums" style={{ fontFamily: "'Instrument Serif', serif" }}>
              {String(count).padStart(3, '0')}
            </div>
          </div>
          <div className="h-[3px] bg-stroke/50 w-full relative mt-8">
            <div
              className="absolute inset-0 accent-gradient origin-left transition-transform duration-100 ease-linear"
              style={{ transform: `scaleX(${count / 100})` }}
            />
          </div>
        </div>
      );
    }

    // ---------- Navbar ----------
    function Navbar() {
      const [scrolled, setScrolled] = useState(false);
      const [active, setActive] = useState('Home');
      const navItems = ['Home', 'Work', 'Resume'];

      useEffect(() => {
        const onScroll = () => setScrolled(window.scrollY > 100);
        window.addEventListener('scroll', onScroll);
        return () => window.removeEventListener('scroll', onScroll);
      }, []);

      return (
        <motion.nav
          initial={{ y: -20, opacity: 0 }}
          animate={{ y: 0, opacity: 1 }}
          transition={{ duration: 0.6, delay: 0.5 }}
          className="fixed top-0 left-0 right-0 z-50 flex justify-center pt-4 md:pt-6 px-4"
        >
          <div className={`
            inline-flex items-center rounded-full backdrop-blur-md border border-white/10 
            bg-surface px-2 py-2 transition-shadow duration-300
            ${scrolled ? 'shadow-md shadow-black/10' : ''}
          `}>
            {/* Logo */}
            <div className="relative w-9 h-9 rounded-full accent-gradient p-[2px] group hover:scale-110 transition-transform cursor-pointer">
              <div className="w-full h-full rounded-full bg-bg flex items-center justify-center font-display italic text-[13px]" style={{ fontFamily: "'Instrument Serif', serif" }}>
                JA
              </div>
            </div>
            <div className="w-px h-5 bg-stroke mx-1 hidden sm:block" />
            <div className="flex items-center gap-0.5">
              {navItems.map((item) => (
                <button
                  key={item}
                  onClick={() => setActive(item)}
                  className={`
                    text-xs sm:text-sm rounded-full px-3 sm:px-4 py-1.5 sm:py-2 transition-all
                    ${active === item ? 'text-text-primary bg-stroke/50' : 'text-muted hover:text-text-primary hover:bg-stroke/50'}
                  `}
                >
                  {item}
                </button>
              ))}
            </div>
            <div className="w-px h-5 bg-stroke mx-1 hidden sm:block" />
            <div className="relative group">
              <span className="absolute inset-[-2px] rounded-full accent-gradient opacity-0 group-hover:opacity-100 transition-opacity animate-gradient-shift" />
              <div className="relative bg-surface rounded-full backdrop-blur-md px-3 sm:px-4 py-1.5 sm:py-2 flex items-center gap-1 text-xs sm:text-sm text-text-primary">
                Say hi <span className="text-xs">↗</span>
              </div>
            </div>
          </div>
        </motion.nav>
      );
    }

    // ---------- Hero ----------
    function Hero() {
      const videoRef = useRef(null);
      const nameRef = useRef(null);
      const blurRefs = useRef([]);
      const [roleIndex, setRoleIndex] = useState(0);
      const roles = ['Creative', 'Fullstack', 'Founder', 'Scholar'];

      useEffect(() => {
        // HLS video setup
        const video = videoRef.current;
        if (video) {
          const hls = new Hls();
          const src = 'https://stream.mux.com/Aa02T7oM1wH5Mk5EEVDYhbZ1ChcdhRsS2m1NYyx4Ua1g.m3u8';
          if (Hls.isSupported()) {
            hls.loadSource(src);
            hls.attachMedia(video);
          } else if (video.canPlayType('application/vnd.apple.mpegurl')) {
            video.src = src;
          }
        }

        // GSAP entrance
        const tl = gsap.timeline({ defaults: { ease: 'power3.out' } });
        tl.fromTo(nameRef.current, { opacity: 0, y: 50 }, { opacity: 1, y: 0, duration: 1.2, delay: 0.1 });
        blurRefs.current.forEach((el, i) => {
          tl.fromTo(el, { opacity: 0, y: 20, filter: 'blur(10px)' }, { opacity: 1, y: 0, filter: 'blur(0px)', duration: 1, delay: 0.3 + i * 0.1 }, '-=0.6');
        });
      }, []);

      useEffect(() => {
        const interval = setInterval(() => setRoleIndex((i) => (i + 1) % roles.length), 2000);
        return () => clearInterval(interval);
      }, []);

      return (
        <section className="relative h-screen w-full overflow-hidden">
          <video
            ref={videoRef}
            autoPlay
            muted
            loop
            playsInline
            className="absolute top-1/2 left-1/2 min-w-full min-h-full object-cover -translate-x-1/2 -translate-y-1/2"
          />
          <div className="absolute inset-0 bg-black/20" />
          <div className="absolute bottom-0 h-48 bg-gradient-to-t from-bg to-transparent" />

          <div className="relative z-10 h-full flex flex-col items-center justify-center text-center px-6">
            <p ref={(el) => { if (el) blurRefs.current.push(el); }} className="text-xs text-muted uppercase tracking-[0.3em] mb-8">
              COLLECTION '26
            </p>
            <h1 ref={nameRef} className="text-6xl md:text-8xl lg:text-9xl font-display italic leading-[0.9] tracking-tight text-text-primary mb-6" style={{ fontFamily: "'Instrument Serif', serif" }}>
              Michael Smith
            </h1>
            <div className="text-base md:text-lg text-muted mb-4 flex items-center gap-2 flex-wrap justify-center">
              A{' '}
              <span className="font-display italic text-text-primary animate-role-fade-in inline-block" style={{ fontFamily: "'Instrument Serif', serif" }} key={roleIndex}>
                {roles[roleIndex]}
              </span>{' '}
              lives in Chicago.
            </div>
            <p className="text-sm md:text-base text-muted max-w-md mb-12">
              Designing seamless digital interactions by focusing on the unique nuances which bring systems to life.
            </p>
            <div className="inline-flex gap-4 flex-wrap justify-center">
              <button className="rounded-full text-sm px-7 py-3.5 bg-text-primary text-bg hover:bg-bg hover:text-text-primary border-2 border-transparent hover:border-stroke transition-all hover:scale-105">
                See Works
              </button>
              <button className="rounded-full text-sm px-7 py-3.5 border-2 border-stroke bg-bg text-text-primary hover:border-transparent hover:ring-2 hover:ring-accent-gradient transition-all hover:scale-105">
                Reach out...
              </button>
            </div>
          </div>

          <div className="absolute bottom-12 left-1/2 -translate-x-1/2 z-20 flex flex-col items-center gap-2 text-xs text-muted uppercase tracking-[0.2em]">
            SCROLL
            <div className="w-px h-10 bg-stroke relative overflow-hidden">
              <div className="absolute top-0 left-0 w-full h-1/2 bg-text-primary animate-scroll-down" />
            </div>
          </div>
        </section>
      );
    }

    // ---------- Works ----------
    function Works() {
      const projects = [
        { title: 'Automotive Motion', span: 'md:col-span-7', aspect: 'aspect-[4/3]', img: 'https://images.unsplash.com/photo-1492144534655-ae79c964c9d7?w=600' },
        { title: 'Urban Architecture', span: 'md:col-span-5', aspect: 'aspect-[3/4]', img: 'https://images.unsplash.com/photo-1480714378408-67cf0d13bc1b?w=600' },
        { title: 'Human Perspective', span: 'md:col-span-5', aspect: 'aspect-[3/4]', img: 'https://images.unsplash.com/photo-1507003211169-0a1dd7228f2d?w=600' },
        { title: 'Brand Identity', span: 'md:col-span-7', aspect: 'aspect-[4/3]', img: 'https://images.unsplash.com/photo-1558655146-9f40138edfeb?w=600' },
      ];

      return (
        <section className="bg-bg py-12 md:py-16">
          <div className="max-w-[1200px] mx-auto px-6 md:px-10 lg:px-16">
            <motion.div
              initial={{ opacity: 0, y: 30 }}
              whileInView={{ opacity: 1, y: 0 }}
              transition={{ duration: 1, ease: [0.25, 0.1, 0.25, 1] }}
              viewport={{ once: true, margin: '-100px' }}
              className="flex flex-col md:flex-row justify-between items-start md:items-end mb-12"
            >
              <div>
                <div className="flex items-center gap-3 mb-2">
                  <div className="w-8 h-px bg-stroke" />
                  <span className="text-xs text-muted uppercase tracking-[0.3em]">Selected Work</span>
                </div>
                <h2 className="text-4xl md:text-5xl font-display italic" style={{ fontFamily: "'Instrument Serif', serif" }}>
                  Featured <span className="font-display italic">projects</span>
                </h2>
                <p className="text-muted text-sm mt-2 max-w-md">
                  A selection of projects I've worked on, from concept to launch.
                </p>
              </div>
              <button className="hidden md:inline-flex rounded-full border border-stroke px-6 py-2 text-sm hover:ring-2 hover:ring-accent-gradient transition-all items-center gap-2">
                View all work <span>→</span>
              </button>
            </motion.div>

            <div className="grid grid-cols-1 md:grid-cols-12 gap-5 md:gap-6">
              {projects.map((project, idx) => (
                <motion.div
                  key={idx}
                  initial={{ opacity: 0, y: 40 }}
                  whileInView={{ opacity: 1, y: 0 }}
                  transition={{ duration: 0.8, delay: idx * 0.1 }}
                  viewport={{ once: true }}
                  className={`${project.span} relative group overflow-hidden rounded-3xl bg-surface border border-stroke ${project.aspect}`}
                >
                  <img src={project.img} alt={project.title} className="w-full h-full object-cover group-hover:scale-105 transition-transform duration-500" />
                  <div className="absolute inset-0 bg-[radial-gradient(circle,#000_1px,transparent_1px)] bg-[length:4px_4px] opacity-20 mix-blend-multiply" />
                  <div className="absolute inset-0 bg-bg/70 backdrop-blur-lg opacity-0 group-hover:opacity-100 transition-opacity duration-500 flex items-center justify-center">
                    <div className="rounded-full bg-white px-6 py-3 flex items-center gap-2 text-sm font-medium shadow-lg">
                      View — <span className="font-display italic" style={{ fontFamily: "'Instrument Serif', serif" }}>{project.title}</span>
                    </div>
                  </div>
                </motion.div>
              ))}
            </div>
          </div>
        </section>
      );
    }

    // ---------- Journal ----------
    function Journal() {
      const entries = [
        { title: 'Designing for emotion', date: 'Feb 12, 2026', readTime: '3 min read', img: 'https://images.unsplash.com/photo-1544716278-ca5e3f4abd8c?w=200' },
        { title: 'The future of UX', date: 'Jan 28, 2026', readTime: '5 min read', img: 'https://images.unsplash.com/photo-1551288049-bebda4e38f71?w=200' },
        { title: 'Building with purpose', date: 'Jan 15, 2026', readTime: '4 min read', img: 'https://images.unsplash.com/photo-1517245386807-bb43f82c33c4?w=200' },
        { title: 'Lessons from failure', date: 'Dec 30, 2025', readTime: '6 min read', img: 'https://images.unsplash.com/photo-1521791136064-7986c2920216?w=200' },
      ];

      return (
        <section className="bg-bg py-16 md:py-24">
          <div className="max-w-[1200px] mx-auto px-6 md:px-10 lg:px-16">
            <motion.div
              initial={{ opacity: 0, y: 30 }}
              whileInView={{ opacity: 1, y: 0 }}
              transition={{ duration: 1, ease: [0.25, 0.1, 0.25, 1] }}
              viewport={{ once: true, margin: '-100px' }}
              className="flex flex-col md:flex-row justify-between items-start md:items-end mb-12"
            >
              <div>
                <div className="flex items-center gap-3 mb-2">
                  <div className="w-8 h-px bg-stroke" />
                  <span className="text-xs text-muted uppercase tracking-[0.3em]">Recent thoughts</span>
                </div>
                <h2 className="text-4xl md:text-5xl font-display italic" style={{ fontFamily: "'Instrument Serif', serif" }}>
                  Recent <span className="font-display italic">thoughts</span>
                </h2>
                <p className="text-muted text-sm mt-2">Insights from the intersection of code and creativity.</p>
              </div>
              <button className="hidden md:inline-flex rounded-full border border-stroke px-6 py-2 text-sm hover:ring-2 hover:ring-accent-gradient transition-all items-center gap-2">
                View all <span>→</span>
              </button>
            </motion.div>

            <div className="flex flex-col gap-4">
              {entries.map((entry, idx) => (
                <motion.div
                  key={idx}
                  initial={{ opacity: 0, x: -20 }}
                  whileInView={{ opacity: 1, x: 0 }}
                  transition={{ duration: 0.5, delay: idx * 0.1 }}
                  viewport={{ once: true }}
                  className="flex items-center gap-6 p-4 bg-surface/30 hover:bg-surface border border-stroke rounded-[40px] sm:rounded-full transition-colors cursor-pointer"
                >
                  <img src={entry.img} alt={entry.title} className="w-16 h-16 rounded-full object-cover flex-shrink-0" />
                  <div className="flex-1 min-w-0">
                    <h3 className="font-medium text-sm sm:text-base truncate">{entry.title}</h3>
                    <p className="text-xs text-muted mt-0.5">{entry.readTime} • {entry.date}</p>
                  </div>
                  <div className="text-muted text-sm hidden sm:block">→</div>
                </motion.div>
              ))}
            </div>
          </div>
        </section>
      );
    }

    // ---------- Explorations ----------
    function Explorations() {
      const containerRef = useRef(null);
      const contentRef = useRef(null);
      const col1Ref = useRef(null);
      const col2Ref = useRef(null);
      const items = [
        'https://images.unsplash.com/photo-1558655146-9f40138edfeb?w=400',
        'https://images.unsplash.com/photo-1492144534655-ae79c964c9d7?w=400',
        'https://images.unsplash.com/photo-1480714378408-67cf0d13bc1b?w=400',
        'https://images.unsplash.com/photo-1507003211169-0a1dd7228f2d?w=400',
        'https://images.unsplash.com/photo-1544716278-ca5e3f4abd8c?w=400',
        'https://images.unsplash.com/photo-1517245386807-bb43f82c33c4?w=400',
      ];

      useEffect(() => {
        if (!containerRef.current || !contentRef.current || !col1Ref.current || !col2Ref.current) return;
        const container = containerRef.current;
        const content = contentRef.current;
        const col1 = col1Ref.current;
        const col2 = col2Ref.current;

        ScrollTrigger.create({
          trigger: container,
          start: 'top top',
          end: 'bottom bottom',
          pin: content,
          pinSpacing: false,
        });

        const tl = gsap.timeline({
          scrollTrigger: {
            trigger: container,
            start: 'top top',
            end: 'bottom bottom',
            scrub: 1,
          },
        });
        tl.fromTo(col1, { y: 0 }, { y: -100, duration: 1 }, 0)
          .fromTo(col2, { y: 0 }, { y: 100, duration: 1 }, 0);

        return () => {
          ScrollTrigger.getAll().forEach(t => t.kill());
        };
      }, []);

      return (
        <section ref={containerRef} className="relative min-h-[300vh] bg-bg">
          <div ref={contentRef} className="sticky top-0 h-screen flex flex-col items-center justify-center z-10 px-6">
            <div className="text-center">
              <div className="flex items-center justify-center gap-3 mb-2">
                <div className="w-8 h-px bg-stroke" />
                <span className="text-xs text-muted uppercase tracking-[0.3em]">Explorations</span>
              </div>
              <h2 className="text-4xl md:text-5xl font-display italic" style={{ fontFamily: "'Instrument Serif', serif" }}>
                Visual <span className="font-display italic">playground</span>
              </h2>
              <p className="text-muted text-sm mt-2">Experiments in motion and form.</p>
              <button className="mt-6 rounded-full border border-stroke px-6 py-2 text-sm hover:ring-2 hover:ring-accent-gradient transition-all inline-flex items-center gap-2">
                Dribbble <span>→</span>
              </button>
            </div>
          </div>

          <div className="absolute inset-0 z-20 pointer-events-none">
            <div className="max-w-[1400px] mx-auto h-full grid grid-cols-2 gap-12 md:gap-40 px-6 md:px-10 lg:px-16">
              <div ref={col1Ref} className="flex flex-col gap-8 items-start justify-center">
                {items.slice(0, 3).map((url, i) => (
                  <div key={i} className="aspect-square max-w-[320px] w-full bg-surface rounded-2xl overflow-hidden shadow-xl rotate-[-3deg] hover:rotate-0 transition-transform duration-300 pointer-events-auto">
                    <img src={url} alt="exploration" className="w-full h-full object-cover" />
                  </div>
                ))}
              </div>
              <div ref={col2Ref} className="flex flex-col gap-8 items-end justify-center">
                {items.slice(3).map((url, i) => (
                  <div key={i} className="aspect-square max-w-[320px] w-full bg-surface rounded-2xl overflow-hidden shadow-xl rotate-[3deg] hover:rotate-0 transition-transform duration-300 pointer-events-auto">
                    <img src={url} alt="exploration" className="w-full h-full object-cover" />
                  </div>
                ))}
              </div>
            </div>
          </div>
        </section>
      );
    }

    // ---------- Stats ----------
    function Stats() {
      const stats = [
        { value: '20+', label: 'Years Experience' },
        { value: '95+', label: 'Projects Done' },
        { value: '200%', label: 'Satisfied Clients' },
      ];

      return (
        <section className="bg-bg py-16 md:py-24">
          <div className="max-w-[1200px] mx-auto px-6 md:px-10 lg:px-16">
            <div className="grid grid-cols-1 md:grid-cols-3 gap-8 text-center">
              {stats.map((stat, idx) => (
                <motion.div
                  key={idx}
                  initial={{ opacity: 0, scale: 0.9 }}
                  whileInView={{ opacity: 1, scale: 1 }}
                  transition={{ duration: 0.6, delay: idx * 0.1 }}
                  viewport={{ once: true }}
                >
                  <div className="text-5xl md:text-6xl font-display italic text-text-primary" style={{ fontFamily: "'Instrument Serif', serif" }}>{stat.value}</div>
                  <div className="text-sm text-muted mt-2">{stat.label}</div>
                </motion.div>
              ))}
            </div>
          </div>
        </section>
      );
    }

    // ---------- Contact ----------
    function Contact() {
      const videoRef = useRef(null);
      const marqueeRef = useRef(null);

      useEffect(() => {
        const video = videoRef.current;
        if (video) {
          const hls = new Hls();
          const src = 'https://stream.mux.com/Aa02T7oM1wH5Mk5EEVDYhbZ1ChcdhRsS2m1NYyx4Ua1g.m3u8';
          if (Hls.isSupported()) {
            hls.loadSource(src);
            hls.attachMedia(video);
          } else if (video.canPlayType('application/vnd.apple.mpegurl')) {
            video.src = src;
          }
        }

        if (marqueeRef.current) {
          gsap.to(marqueeRef.current, {
            xPercent: -50,
            duration: 40,
            ease: 'none',
            repeat: -1,
          });
        }
      }, []);

      return (
        <section className="relative bg-bg pt-16 md:pt-20 pb-8 md:pb-12 overflow-hidden">
          <video
            ref={videoRef}
            autoPlay
            muted
            loop
            playsInline
            className="absolute inset-0 w-full h-full object-cover scale-y-[-1]"
          />
          <div className="absolute inset-0 bg-black/60" />

          <div className="relative z-10 overflow-hidden py-6 border-y border-white/10">
            <div ref={marqueeRef} className="flex whitespace-nowrap gap-12 text-6xl md:text-8xl font-display italic text-white/20" style={{ fontFamily: "'Instrument Serif', serif" }}>
              {Array(10).fill('BUILDING THE FUTURE • ').join('')}
            </div>
          </div>

          <div className="relative z-10 max-w-[1200px] mx-auto px-6 md:px-10 lg:px-16 py-12 text-center">
            <h2 className="text-4xl md:text-5xl font-display italic text-text-primary mb-6" style={{ fontFamily: "'Instrument Serif', serif" }}>Let's build something</h2>
            <a
              href="mailto:hello@michaelsmith.com"
              className="inline-block rounded-full bg-text-primary text-bg px-8 py-4 text-sm font-medium hover:ring-2 hover:ring-accent-gradient transition-all"
            >
              hello@michaelsmith.com
            </a>

            <div className="mt-16 pt-8 border-t border-stroke flex flex-col sm:flex-row justify-between items-center gap-4 text-sm text-muted">
              <div className="flex items-center gap-4">
                <span className="flex items-center gap-2">
                  <span className="w-2 h-2 rounded-full bg-green-400 animate-pulse" />
                  Available for projects
                </span>
              </div>
              <div className="flex gap-6">
                <a href="#" className="hover:text-text-primary transition">Twitter</a>
                <a href="#" className="hover:text-text-primary transition">LinkedIn</a>
                <a href="#" className="hover:text-text-primary transition">Dribbble</a>
                <a href="#" className="hover:text-text-primary transition">GitHub</a>
              </div>
            </div>
          </div>
        </section>
      );
    }

    // ---------- App ----------
    function App() {
      const [isLoading, setIsLoading] = useState(true);

      useEffect(() => {
        document.documentElement.style.scrollBehavior = 'smooth';
      }, []);

      return (
        <>
          {isLoading && <LoadingScreen onComplete={() => setIsLoading(false)} />}
          {!isLoading && (
            <>
              <Navbar />
              <Hero />
              <Works />
              <Journal />
              <Explorations />
              <Stats />
              <Contact />
            </>
          )}
        </>
      );
    }

    // Render
    const root = createRoot(document.getElementById('root'));
    root.render(<App />);
  </script>
</body>
</html>
