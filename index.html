<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Silver Mirror Button - Live Camera</title>

<style>
*{box-sizing:border-box;margin:0;padding:0}

html,body{
    width:100%;
    height:100%;
}

body{
    display:flex;
    justify-content:center;
    align-items:center;
    background:#d3d3d3;
    font-family:Arial,sans-serif;
}

.btn{
    position:relative;
    width:250px;
    height:80px;
    padding:0;
    border:2px solid rgba(255,255,255,.9);
    border-radius:50px;
    overflow:hidden;
    cursor:pointer;
    background:#777;
    isolation:isolate;
    box-shadow:
        5px 5px 15px rgba(0,0,0,.5),
        inset -5px -5px 15px rgba(255,255,255,.7),
        inset 5px 5px 15px rgba(255,255,255,.7);
}

/* THIS IS THE ACTUAL LIVE FRONT CAMERA */
.cam{
    position:absolute;
    inset:0;
    width:100%;
    height:100%;
    display:block;
    object-fit:cover;
    z-index:1;
    opacity:1;
    filter:none;
    transform:scaleX(-1);
}

/* subtle silver glass, NOT opaque */
.btn::after{
    content:"";
    position:absolute;
    inset:0;
    z-index:2;
    pointer-events:none;
    border-radius:50px;
    background:linear-gradient(
        135deg,
        rgba(255,255,255,.18),
        rgba(255,255,255,.02) 35%,
        rgba(255,255,255,.12) 60%,
        rgba(100,100,100,.10)
    );
}

/* text */
.btn span{
    position:absolute;
    inset:0;
    z-index:3;
    display:flex;
    align-items:center;
    justify-content:center;
    color:#333;
    font-size:46px;
    font-weight:400;
    text-shadow:
        0 1px 1px rgba(255,255,255,.9),
        0 2px 3px rgba(0,0,0,.25);
    pointer-events:none;
}

#status{
    position:fixed;
    bottom:20px;
    left:50%;
    transform:translateX(-50%);
    padding:8px 14px;
    border-radius:10px;
    background:rgba(0,0,0,.75);
    color:white;
    font:14px Arial,sans-serif;
}
</style>
</head>

<body>

<button class="btn" type="button">
    <video
        id="cam"
        class="cam"
        autoplay
        muted
        playsinline
        webkit-playsinline>
    </video>

    <span>Click</span>
</button>

<div id="status">Starting front camera…</div>

<script>
const cam = document.getElementById("cam");
const status = document.getElementById("status");

async function startFrontCamera(){
    try{
        if(!navigator.mediaDevices || !navigator.mediaDevices.getUserMedia){
            throw new Error("Camera API unavailable. Open this page on HTTPS or localhost.");
        }

        const stream = await navigator.mediaDevices.getUserMedia({
            audio:false,
            video:{
                facingMode:{exact:"user"},
                width:{ideal:1280},
                height:{ideal:720}
            }
        });

        cam.srcObject = stream;

        await cam.play();

        status.textContent = "Front camera ON";
        setTimeout(()=>status.remove(),1200);

    }catch(error){
        console.error(error);

        status.textContent =
            "Camera blocked. Open this HTML through localhost/HTTPS.";
    }
}

window.addEventListener("load", startFrontCamera);
</script>

</body>
</html>
